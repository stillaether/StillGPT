<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StillGPT v1.1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;

      background: #000;
      color: #fff
    }

    header {
      padding: 10px 20px;
      background: #202123;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 100%;
      margin: 0;
      width: 100%;
      padding: 0;

      min-height: 0;
    }

    .chat-container {
      flex: 1;

      overflow-y: auto;

      padding: 20px;

      max-width: 800px;
      width: 100%;
      margin: 0 auto;

      min-height: 0;
    }

    .chat {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-bottom: 20px;
    }

    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;

    }

    .msg .avatar {
      width: 35px;
      height: 35px;
      border-radius: 4px;
      background: #10a37f;
      color: #fff;
      text-align: center;
      line-height: 35px;
      font-size: 16px;
      flex-shrink: 0;

    }

    .msg.ai .avatar {
      background: #9e10a3;

      font-weight: bold;
    }

    .msg.user .avatar {
      background: #a186ff;

      font-weight: bold;
    }

    .msg .bubble {
      padding: 10px 16px;
      border-radius: 18px;
      max-width: 70%;
      word-break: break-word;
      font-size: 15px;

      background: #202123;

      color: #fff;
      border-top-left-radius: 18px;

      border-bottom-right-radius: 18px;

    }

    .msg.user {

      justify-content: flex-start;

    }

    .msg.user .bubble {

      background: #202123;

      border-bottom-right-radius: 18px;
    }

    .msg.ai .bubble {
      border-bottom-left-radius: 18px;
    }

    .inputbar {
      padding: 10px;
      border-top: 1px solid #444;
      position: sticky;
      bottom: 0;
      background: #202123;
    }

    .inputbar form {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      padding: 0 20px;
    }

    .inputbar input[type=text] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 30px;
      border: none;
      background: #40414f;
      color: #fff;
      font-size: 16px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .inputbar button {
      padding: 10px 15px;
      border-radius: 30px;
      border: none;
      background: #10a37f;
      color: #fff;
      cursor: pointer
    }

    .inputbar button:disabled {
      background: #444;
      cursor: not-allowed
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #202123;
    }

    #sidebar {
      width: 260px;
      background: #202123;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      padding-top: 10px;
    }

    #sidebar h3 {
      margin: 8px;
      font-size: 14px;
      font-weight: 400;
      color: #ccc;
    }

    #chatList {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .chatItem {
      padding: 8px 10px;
      margin: 4px 0;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ccc;
      font-size: 14px;
    }

    .chatItem:hover {
      background: #343541;
      color: #fff;
    }

    .chatItem.active {
      background: #343541;
      color: #fff;
    }

    .chatItem button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
      margin-left: 8px;
    }

    #newChatBtn {
      width: calc(100% - 20px);
      margin: 10px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #343541;
      color: #fff;
      cursor: pointer;
      text-align: left;
    }

    #newChatBtn:hover {
      background: rgb(23, 100, 233);
    }

    #toggleBtn {
      position: fixed;
      left: 2px;
      top: 2px;
      z-index: 10;
      background: transparent;
      border: 0px solid #555;
      color: #fff;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      padding-top: 5px;
    }

    @keyframes rgb-smooth {
      0% {
        box-shadow: 0 0 10px 2px #ff0000;
      }

      33% {
        box-shadow: 0 0 10px 2px #008800;
      }

      66% {
        box-shadow: 0 0 10px 2px #0000bb;
      }

      100% {
        box-shadow: 0 0 10px 2px #ff0000;
      }
    }

    .msg .bubble.typing {
      border: 0px solid #10a37f;
      animation: rgb-smooth 3s infinite;
    }

    @media(min-width:600px) {
      #toggleBtn {
        display: none
      }

      #sidebar {
        flex: none
      }

      main {
        padding-left: 0;
        min-height: 0;
      }

    }

    @media(max-width:599px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100%;
        transform: translateX(-100%);
        transition: transform .2s;
        z-index: 5
      }

      #sidebar.open {
        transform: translateX(0)
      }

      main {
        margin-left: 0;
        padding: 40px 0 0 0;
      }

      .inputbar form {
        padding: 0 10px;
      }

      .chat-container {
        padding: 10px;
      }
    }

    .searchbar {
      width: calc(100% - 42px);
      margin: 5px 10px;
      padding: 8px 10px;
      border-radius: 21px;
      border: 1px solid #444;
      background: transparent;
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- ======  NEW drawer  ====== -->
    <button id="toggleBtn">☰</button>
    <aside id="sidebar">
      <h3 style="text-align: center;">Chats</h3>
      <button id="newChatBtn">+ New chat</button>
      <input type="text" id="chatSearch" placeholder="Search chats..." class="searchbar">
      <div id="chatList"></div>
    </aside>

    <!-- ======  original column  ====== -->
    <div style="flex:1;display:flex;flex-direction:column">
      <header style="text-align: center;">
        StillGPT
        <span id="deviceInfo" style="float:right;color:#aaa"></span>
      </header>
      <main>
        <div class="chat-container">
          <section class="chat" id="chat"></section>
        </div>
      </main>
      <div class="inputbar">
        <form id="chatForm">
          <input id="chatInput" type="text" placeholder="Send a message…" autocomplete="off" />
          <button id="sendBtn" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">

    import { pipeline, TextStreamer, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5 ";

    const embModel = 'Xenova/all-MiniLM-L12-v2';
    let embedder;

    function cosine(a, b) {
      let dot = 0, na = 0, nb = 0;
      for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
      return dot / (Math.sqrt(na) * Math.sqrt(nb) || 1);
    }
    async function embed(text) {
      if (!embedder) embedder = await pipeline('feature-extraction', embModel, { device: 'webgpu', dtype: 'int8' });
      const out = await embedder(text, { pooling: 'mean', normalize: true });
      return out.tolist()[0];
    }
    function topK(qVec, store, k = 3, minScore = 0.8) {
      return store
        .map((it, idx) => ({ ...it, score: cosine(qVec, it.vec) }))
        .filter(it => it.score >= minScore) // NEW: Filter by minimum relevance score
        .sort((a, b) => b.score - a.score)
        .slice(0, k);
    }

    const STORE_CHATS = 'gc_chats_v1';
    const STORE_VECS = 'gc_vecs_v1';

    class ChatManager {
      constructor() {
        this.chats = JSON.parse(localStorage.getItem(STORE_CHATS) || '[]');
        this.vectors = JSON.parse(localStorage.getItem(STORE_VECS) || '[]');
        this.activeId = null;
      }
      async create(title = 'New chat') {
        const id = Date.now().toString();
        this.chats.push({ id, title, messages: [], createdAt: Date.now() });
        this.save();
        return id;
      }
      select(id) { this.activeId = id; }
      get active() { return this.chats.find(c => c.id === this.activeId); }
      async updateTitle(firstMessage) {
        const chat = this.active;
        if (!chat || !firstMessage) return;

        try {
          const generate = await getGenerator();
          const promptForTitle = formatChatPrompt(`Based on this message, generate a very short (2-4 words) title for the chat: "${firstMessage}"`);
          const titleResponse = await generate(promptForTitle, {
            max_new_tokens: 10,
            temperature: 0.7,
            return_full_text: false
          });

          let newTitle = titleResponse[0]?.generated_text?.trim() || chat.title;

          newTitle = newTitle.replace(/["""]/g, '').replace(/<\|.*?\|>/g, '').trim();
          chat.title = newTitle;
          this.save();
          renderSidebar();
        } catch (err) {
          console.error('Failed to generate title:', err);
        }
      }
      addMessage(role, content) {
        const chat = this.active;
        if (!chat) return;
        const isFirstMessage = chat.messages.length === 0 && role === 'user';
        chat.messages.push({ role, content, ts: Date.now() });
        this.save();
        if (isFirstMessage) {
          this.updateTitle(content);
        }
      }
      save() {
        localStorage.setItem(STORE_CHATS, JSON.stringify(this.chats));
        localStorage.setItem(STORE_VECS, JSON.stringify(this.vectors));
      }
      tokenEstimate() {
        const chat = this.active;
        if (!chat) return 0;
        return chat.messages.reduce((n, m) => n + m.content.length / 4, 0);
      }
      async pushVector(text, chatId, msgId) {
        const vec = await embed(text);
        this.vectors.push({ vec, text, chatId, msgId, ts: Date.now() });
        this.save();
      }
    }
    const mgr = new ChatManager();

    function renderSidebar() {
      const list = document.getElementById('chatList');
      const searchInput = document.getElementById('chatSearch');
      const searchTerm = searchInput?.value.toLowerCase() || '';

      list.innerHTML = '';

      const sortedChats = [...mgr.chats].sort((a, b) => b.createdAt - a.createdAt);

      const filteredChats = sortedChats.filter(c =>
        c.title.toLowerCase().includes(searchTerm)
      );

      filteredChats.forEach(c => {
        const div = document.createElement('div');
        div.className = 'chatItem' + (c.id === mgr.activeId ? ' active' : '');
        div.innerHTML = `<span>${c.title}</span><button data-del="${c.id}">✖</button>`;
        div.onclick = e => {
          if (e.target.tagName === 'BUTTON') {
            mgr.chats = mgr.chats.filter(x => x.id !== c.id);
            mgr.save();
            renderSidebar();
            if (mgr.activeId === c.id) loadChat();
            return;
          }
          mgr.select(c.id); loadChat(); renderSidebar();
        };
        list.appendChild(div);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('chatSearch');
      if (searchInput) {
        searchInput.oninput = renderSidebar;
      }
    });

    document.getElementById('newChatBtn').onclick = () => {
      mgr.create('Chat ' + (mgr.chats.length + 1)); mgr.select(mgr.chats[mgr.chats.length - 1].id);
      loadChat(); renderSidebar();
    };
    document.getElementById('toggleBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');

    function loadChat() {
      const box = document.getElementById('chat');
      box.innerHTML = '';
      const chat = mgr.active;
      if (!chat) {

        if (mgr.chats.length > 0) {
          const mostRecent = mgr.chats.reduce((a, b) => (a.createdAt > b.createdAt ? a : b));
          mgr.select(mostRecent.id);
        } else {

          mgr.select(mgr.create('New Chat'));
        }
        renderSidebar();
        return loadChat();
      }
      chat.messages.forEach(m => addMessage(m.role, m.content));
      checkTokenLimit();
    }
    function checkTokenLimit() {
      const maxCtx = 2048;
      const used = mgr.tokenEstimate();
      const input = document.getElementById('chatInput');
      const btn = document.getElementById('sendBtn');
      const limit = used > maxCtx * 0.9;
      input.disabled = limit;
      btn.disabled = limit;
      input.placeholder = limit ? 'Context full – start a new chat' : 'Send a message…';
    }

    const chat = document.getElementById('chat');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const deviceInfo = document.getElementById('deviceInfo');

    const sanitizeText = s => typeof s === 'string' ? s.replace(/\uFFFD/g, '').replace(/[^\t\n\r -~\u00A0-\u024F]/g, '') : s;
    function addMessage(role, text = '') {
      const msg = document.createElement('div');
      msg.className = 'msg ' + (role === 'ai' ? 'ai' : 'user');
      const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = role === 'ai' ? '🌀' : '👤';
      const bubble = document.createElement('div'); bubble.className = 'bubble';
      const textNode = document.createTextNode(sanitizeText(text)); bubble.appendChild(textNode);
      msg.append(avatar, bubble); chat.appendChild(msg);

      const container = document.querySelector('.chat-container');
      requestAnimationFrame(() => container.scrollTop = container.scrollHeight);

      return { msg, bubble, textNode };
    }

    const localModelsBase = new URL('models/', window.location.href).toString();
    env.localModelPath = localModelsBase;
    env.allowLocalModels = true;
    env.allowRemoteModels = true;
    let modelId = 'onnx-community/granite-4.0-350m-ONNX-web';
    const hasWebGPU = typeof navigator !== 'undefined' && 'gpu' in navigator;
    const device = hasWebGPU ? 'webgpu' : 'wasm';
    deviceInfo.textContent = hasWebGPU ? 'GPU' : 'CPU';

    function formatChatPrompt(userText) {
      const system = 'You are a fun and helpful AI assistant named StillGPT, you love getting to know the user. You are equipped with a memories system, it will bring up memories you may find useful.';
      return (
        '<|start_of_role|>system<|end_of_role|>' + system + '<|end_of_text|>\n' +
        '<|start_of_role|>user<|end_of_role|>' + userText + '<|end_of_text|>\n' +
        '<|start_of_role|>assistant<|end_of_role|>'
      );
    }

    let generatorPromise;
    async function getGenerator() {
      if (!generatorPromise) generatorPromise = pipeline('text-generation', modelId, { device, dtype: 'q4f16' });
      return generatorPromise;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = chatInput.value.trim();
      if (!prompt || chatInput.disabled) return;
      chatInput.value = ''; sendBtn.disabled = true;

      addMessage('user', prompt); mgr.addMessage('user', prompt);
      const ai = addMessage('ai', 'Preparing to respond...');
      const aiTextNode = ai.textNode;
      ai.bubble.classList.add('typing');

      try {

         console.log("Searching for memories...");

        const qVec = await embed(prompt);
        const memories = topK(qVec, mgr.vectors, 3, 0.8).map(r => r.text);
        const memoryBlock = memories.length ? '\n[The StillGPT memories system found these relevant memories from previous chats: ' + memories.join(' | ') + '\nEnd memories list, ignore these System memories if they are irrelevant to the user request]' : '';
        console.log("Memories search returned:" + memoryBlock);
        const promptWithMem = formatChatPrompt(prompt + memoryBlock);

        const generate = await getGenerator();
        const eos = generate.tokenizer?.eos_token_id ?? 100257;
        const pad = generate.tokenizer?.pad_token_id ?? 100256;

        let accumulatedText = '';
        const container = document.querySelector('.chat-container');

        const updateTextCallback = (text) => {
          const s = sanitizeText(text);
          if (!s) return;

          accumulatedText += s;

          requestAnimationFrame(() => {
            aiTextNode.nodeValue = accumulatedText;

            container.scrollTop = container.scrollHeight;
          });
        };

        const streamer = new TextStreamer(generate.tokenizer, {
          skip_prompt: true,
          skip_special_tokens: true,
          callback_function: updateTextCallback,
        });

        await generate(promptWithMem, {
          max_new_tokens: 128, temperature: 0.7, top_p: 0.95, top_k: 100,
          no_repeat_ngram_size: 3, repetition_penalty: 1.2,
          eos_token_id: eos, pad_token_id: pad, return_full_text: false,
          streamer: streamer
        });

        const finalResponse = aiTextNode.nodeValue;

        ai.bubble.classList.remove('typing');
        mgr.addMessage('ai', finalResponse);
        await mgr.pushVector(prompt, mgr.activeId, Date.now());
        await mgr.pushVector(finalResponse, mgr.activeId, Date.now());

      } catch (err) {
        console.error(err);
        aiTextNode.nodeValue = "An error occurred: " + (err.message || 'Model failed to load/run.');
        ai.bubble.classList.remove('typing');
      } finally {
        sendBtn.disabled = false; checkTokenLimit();
      }
    });

    loadChat(); renderSidebar();
  </script>

</body>

</html>
